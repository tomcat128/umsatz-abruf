# Ergänzung: MariaDB-Container als Speicherziel für die Buchungen
#
# Wird zusätzlich zu einer der beiden Compose-Dateien angegeben:
#   docker compose -f docker-compose.yml -f docker-compose.mariadb.yml up -d
#   docker compose -f docker-compose.properties.yml -f docker-compose.mariadb.yml up -d
# oder dauerhaft in .env: COMPOSE_FILE=docker-compose.yml:docker-compose.mariadb.yml
#
# Einrichtung: DB_PASSWORT in .env setzen (wird beim ersten Start für den Benutzer festgelegt;
# eine spätere Änderung in .env ändert das Passwort in der Datenbank NICHT).
# Die Datenbank startet automatisch mit; stoppen mit
#   docker compose -f docker-compose.yml -f docker-compose.mariadb.yml down
# Die Daten liegen im Docker-Volume "mariadb-daten" ("down -v" löscht es!).
#
# Zugriff vom Host, z.B.: mariadb -h 127.0.0.1 -P 3307 -u umsatz -p umsaetze
#
# Hinweis: AUSGABE_ZIEL ist hier standardmäßig "datenbank" und hat als Umgebungsvariable
# Vorrang vor ausgabe.ziel in einer gemounteten fints.properties. Für CSV und Datenbank:
# AUSGABE_ZIEL=beide in .env.

# Fester Projektname: Container und Volumes heißen unabhängig vom Ordnernamen gleich
name: umsatz-abruf

services:
  umsatz-abruf:
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      AUSGABE_ZIEL: ${AUSGABE_ZIEL:-datenbank}
      DB_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-umsaetze}
      DB_BENUTZER: ${DB_BENUTZER:-umsatz}
      DB_PASSWORT: ${DB_PASSWORT:?DB_PASSWORT in .env setzen}

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-umsaetze}
      MARIADB_USER: ${DB_BENUTZER:-umsatz}
      MARIADB_PASSWORD: ${DB_PASSWORT:?DB_PASSWORT in .env setzen}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - mariadb-daten:/var/lib/mysql
    ports:
      # Nur lokal erreichbar
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mariadb-daten:
