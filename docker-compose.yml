# Umsatz-Abruf: eine Anwendung in einem Container, Caddy als HTTPS-Reverse-Proxy davor.
#
# Einrichtung:
#   cp .env.example .env && chmod 600 .env   # Werte eintragen (Bankzugang, Web-Login, Domain)
#   mkdir -p daten                           # Datenverzeichnis: Datenbank, Passport-Datei, Status
#   docker compose up -d --build
#
# Danach: https://<WEB_DOMAIN>/
# Die Anwendung ruft nach dem Start alle ABRUF_INTERVALL (Standard 6h) die Umsätze ab.
# Verlangt die Bank eine Autorisierung, die nicht erfolgt, werden die Abrufe ausgesetzt und
# die Notfall-Adresse (MAIL_NOTFALL) benachrichtigt; erneuert wird im Browser.

# Fester Projektname: Container und Volumes heißen unabhängig vom Ordnernamen gleich
name: umsatz-abruf

services:
  umsatz-abruf:
    build:
      context: .
    image: umsatz-abruf:latest
    # Erscheint als "Rechner" in den E-Mails
    hostname: umsatz-abruf
    restart: unless-stopped
    # Nur für Caddy im internen Netz erreichbar
    expose:
      - "8080"
    # Optional zusätzlich direkt (ohne Caddy) vom Host aus erreichbar:
    # ports:
    #   - "127.0.0.1:8080:8080"
    volumes:
      # Datenbank (umsaetze.db) - nach außen gemountet
      - ${DATEN_VERZEICHNIS:-./daten}:/data
      # Von der Anwendung selbst verwaltet: Passport-Datei samt Schlüssel und Betriebszustand.
      # Nicht anfassen - geht es verloren, verlangt die Bank nur einmal eine neue Freigabe.
      - intern:/var/lib/umsatz-abruf
      # Optional statt der Umgebungsvariablen: eine fints.properties einbinden
      # (dann zusätzlich die Zeile "command" unten aktivieren)
      # - ./fints.properties:/config/fints.properties:ro
    # command: ["/config/fints.properties"]
    environment:
      # --- Bankzugang (Pflicht) ---
      FINTS_BLZ: ${FINTS_BLZ:-}
      FINTS_BENUTZER: ${FINTS_BENUTZER:-}
      FINTS_IBAN: ${FINTS_IBAN:-}
      FINTS_KUNDENID: ${FINTS_KUNDENID:-}
      FINTS_PIN: ${FINTS_PIN:-}
      FINTS_URL: ${FINTS_URL:-}
      FINTS_PRODUKTID: ${FINTS_PRODUKTID:-}
      FINTS_TANVERFAHREN: ${FINTS_TANVERFAHREN:-}
      FINTS_TANMEDIUM: ${FINTS_TANMEDIUM:-}
      # --- Abruf ---
      ABRUF_INTERVALL: ${ABRUF_INTERVALL:-6h}
      ABRUF_TAGE: ${ABRUF_TAGE:-7}
      ABRUF_FORMAT: ${ABRUF_FORMAT:-auto}
      AUSGABE_ZIEL: ${AUSGABE_ZIEL:-datenbank}
      # --- Weboberfläche ---
      WEB_BENUTZER: ${WEB_BENUTZER:-}
      WEB_PASSWORT: ${WEB_PASSWORT:-}
      WEB_ADRESSE: ${WEB_ADRESSE:-https://${WEB_DOMAIN:-localhost}}
      WEB_WARTEZEIT: ${WEB_WARTEZEIT:-10}
      # Client-Adresse und HTTPS aus den Kopfzeilen von Caddy übernehmen
      # (Login-Sperre je Adresse, Secure-Cookie, HSTS)
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # --- Notfall-E-Mail ---
      MAIL_NOTFALL: ${MAIL_NOTFALL:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_SICHERHEIT: ${MAIL_SICHERHEIT:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_BENUTZER: ${MAIL_BENUTZER:-}
      MAIL_PASSWORT: ${MAIL_PASSWORT:-}
      MAIL_ABSENDER: ${MAIL_ABSENDER:-}
      # --- Sonstiges ---
      LOG_LEVEL: ${LOG_LEVEL:-2}
      TZ: ${TZ:-Europe/Berlin}

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - umsatz-abruf
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN in .env setzen (z.B. umsatz.example.org oder localhost)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Zertifikate - nicht löschen, sonst neue Ausstellung (Let's Encrypt begrenzt die Anzahl)
      - caddy-daten:/data
      - caddy-konfig:/config

volumes:
  intern:
  caddy-daten:
  caddy-konfig:
