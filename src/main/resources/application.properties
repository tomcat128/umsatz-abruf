# Spring-Einstellungen. Die fachliche Konfiguration steht in fints.properties bzw. in
# Umgebungsvariablen (siehe fints.properties.example). Spring-Werte lassen sich ebenso per
# Umgebungsvariable setzen, z.B. SERVER_PORT=8081.

spring.main.banner-mode=off
spring.application.name=umsatz-abruf

# Nur eigene Meldungen und Warnungen ausgeben
logging.level.root=WARN
logging.level.de.fehrenbacher=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %msg%n

server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.name=UMSATZ_SESSION
# Keine Session-ID in URLs
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

spring.thymeleaf.cache=true
spring.mvc.format.date=iso
